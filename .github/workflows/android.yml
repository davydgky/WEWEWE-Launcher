name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build, unit tests and lint
        run: ./gradlew --stacktrace :core:test assembleDebug assembleRelease testDebugUnitTest lintDebug

      - name: Check that the APKs cannot reach the network
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            "$BT/aapt2" dump permissions "$APK" > permissions.txt
            cat permissions.txt
            if grep -q "android.permission.INTERNET" permissions.txt; then
              echo "::error::$APK requests the INTERNET permission"
              exit 1
            fi
          done

      - name: Show APK signature and version
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "SHA-256|DN"
          "$BT/aapt2" dump badging "$APK" | head -1

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: launcher-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            core/build/reports/

  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    # Informational: the software-rendered CI emulator is too slow to judge latency or to gate merges.
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: launcher-apk
          path: apk

      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install test dependencies
        run: pip install pillow

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 scripts/emulator_smoke.py apk/*.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
