name: Android CI

# Build minutes are limited: a push to a work branch only compiles and runs the unit tests. The release
# build, lint, the emulator test and the release happen on main, or on demand ("Run workflow").
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed_with: ${{ steps.sign.outputs.signed_with }}
      full: ${{ steps.mode.outputs.full }}
    steps:
      - name: Choose quick or full build
        id: mode
        run: echo "full=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Compile and unit tests
        if: steps.mode.outputs.full != 'true'
        run: ./gradlew --stacktrace :core:test compileDebugKotlin testDebugUnitTest

      - name: Build, unit tests and lint
        if: steps.mode.outputs.full == 'true'
        run: ./gradlew --stacktrace :core:test assembleDebug assembleRelease testDebugUnitTest lintDebug

      # Searches never leave the device: the updater is the only code that may open connections.
      - name: Check that only the updater and the Play Store results use the network
        run: |
          OFFENDERS=$(grep -rlE "java\.net\.|HttpURLConnection|URLConnection|okhttp3|java\.nio\.channels\.SocketChannel" app/src/main/java core/src/main | grep -vE "/update/|/store/" || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::network code outside the updater: $OFFENDERS"
            exit 1
          fi

      - name: Sign release APK
        if: steps.mode.outputs.full == 'true'
        id: sign
        env:
          LAUNCHER_KEYSTORE_BASE64: ${{ secrets.LAUNCHER_KEYSTORE_BASE64 }}
          LAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_KEYSTORE_PASSWORD }}
        run: scripts/sign_release.sh

      - name: Check that ML Kit cannot report usage
        if: steps.mode.outputs.full == 'true'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in dist/*.apk app/build/outputs/apk/debug/*.apk; do
            if "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q "CctBackendFactory"; then
              echo "::error::$APK registers ML Kit's usage reporting backend"
              exit 1
            fi
          done

      - name: Show APK signature and version
        if: steps.mode.outputs.full == 'true'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging dist/*.apk | head -1
          "$BT/aapt2" dump permissions dist/*.apk

      - name: Upload release APK
        if: steps.mode.outputs.full == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: launcher-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        if: steps.mode.outputs.full == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            core/build/reports/

  emulator-smoke-test:
    needs: build
    if: needs.build.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      critical: ${{ steps.result.outputs.critical }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: launcher-apk
          path: apk

      - uses: actions/download-artifact@v5
        with:
          name: launcher-debug-apk
          path: apk-debug

      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install test dependencies
        run: pip install pillow

      # Functional checks are informational (the software-rendered emulator is slow and flaky); crashes
      # and "isn't responding" of the launcher are critical and stop the release.
      - name: Run smoke test on emulator
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 17 (API 37) has no emulator image on the runners yet; move up once it has.
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            if [ "${{ needs.build.outputs.signed_with }}" = "release" ]; then scripts/check_key_rotation.sh apk-debug/app-debug.apk apk/launcher-*.apk || echo "critical=true" > smoke-result.txt; fi
            python3 scripts/emulator_smoke.py apk/launcher-*.apk

      - name: Smoke test result
        id: result
        if: always()
        run: |
          if grep -q "critical=true" smoke-result.txt 2>/dev/null || [ ! -f smoke-result.txt ]; then
            echo "critical=true" >> "$GITHUB_OUTPUT"
          else
            echo "critical=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      # Also kept under a hidden ref (not a branch), so the screenshots can be fetched with plain git.
      - name: Publish screenshots for preview
        if: always()
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q
          git add .
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshots of run ${{ github.run_number }} (${{ github.sha }})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/screenshots/latest

  # Every build of main becomes a release; installed launchers find it and update themselves.
  publish:
    needs: [build, emulator-smoke-test]
    if: github.ref == 'refs/heads/main' && needs.emulator-smoke-test.outputs.critical == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: launcher-apk
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          APK=$(ls dist/launcher-*.apk)
          CODE=$(basename "$APK" .apk | sed 's/launcher-//')
          gh release create "v0.1.$CODE" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "WEWEWE 0.1.$CODE" \
            --notes "$NOTES" \
            --latest
